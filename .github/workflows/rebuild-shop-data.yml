name: Rebuild shop-data.js on CSV change

on:
  # Manual trigger, so a rebuild can be forced (and the workflow tested) without
  # waiting for the next Sheets sync: gh workflow run rebuild-shop-data.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/shop/totals.csv'
      - 'data/shop/current.csv'
      - 'data/shop/history.csv'
      - 'data/shop/tap-links.csv'
      - 'data/shop/tap-products.csv'
      - 'data/shop/shop-current.csv'
      - 'data/shop/sugg-products.csv'
      # top-products.csv was missing here: the Sheets sync pushes Top-Products every
      # run, but a commit touching only that file never triggered a rebuild.
      - 'data/shop/top-products.csv'
      # The month-end pair is promoted by hand at month close (the sync writes the
      # plain filenames), so it needs its own trigger to get picked up.
      - 'data/shop/sugg-products-monthend.csv'
      - 'data/shop/top-products-monthend.csv'
      - 'data/shop/monthly/**.csv'

# Only one rebuild at a time. When App Scripts push 5 CSVs in rapid succession,
# each commit triggers this workflow. The concurrency group cancels in-progress
# runs so only the final state (all CSVs updated) produces the rebuilt JS.
concurrency:
  group: rebuild-shop-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so the push back won't diverge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Wait briefly so any remaining rapid sequential commits can land,
      # then pull the latest to ensure we build from the complete CSV state.
      - name: Wait for sequential commits to settle, then pull latest
        run: |
          sleep 8
          git pull --rebase origin main

      - name: Rebuild shop-data.js (creator dashboards)
        run: node build-shop-data.js

      # Without this the rebuilt shop-data.js never reaches browsers: the HTML kept
      # its old ?v= tag, so the CDN and every browser served the cached copy and the
      # dashboard showed stale numbers. Content-hash based, so it's a no-op when the
      # data hasn't actually changed.
      - name: Stamp shop-data.js cache-bust tag
        run: node stamp-shop-data-cache.js

      # TAP storefront pipeline. Builds BOTH bundles index.html actually loads:
      # js/product-data-midmonth.js and js/product-data-monthend.js (plus
      # js/product-data.js, which product-review.html and product-template.html use).
      # Reads the committed product-images.json cache only — image scraping stays a
      # manual/local step, never in CI — and stamps the ?v= cache-bust on both
      # index.html script tags from a hash of the bundles.
      #
      # Was `node build-product-data.js data/shop`, which only ever wrote the
      # mid-month bundle. The two files the storefront reads were last rebuilt
      # 2026-08-12 and drifted for three weeks.
      #
      # The month-end half is skipped with a warning unless
      # data/shop/{sugg,top}-products-monthend.csv exist. That is deliberate: the
      # Sheets sync writes the plain filenames, so promoting an export into the
      # -monthend slot stays a manual month-close step. Auto-promoting here would
      # overwrite month-end data with mid-month data on every sync.
      - name: Rebuild product bundles (TAP storefront, mid-month + month-end)
        run: node build-dual-products.js

      # Product image + brand TAP campaign lookup behind the audit modal's Proven Winners
      # popup. Same feeds as the storefront, but scoped to products actually suggested to
      # creators, so it stays a few KB rather than shipping the whole catalog to the modal.
      - name: Rebuild audit-products.json (audit modal popup)
        run: node build-audit-products.js

      # Month-end report snapshots -> per-account post counts for the Month-End recap.
      # history.csv has no post counts, so this is their only source.
      - name: Rebuild monthly-stats.json (month-end snapshots)
        run: node build-monthly-snapshots.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-rebuild: shop-data.js + product-data.js from CSV'
          file_pattern: 'js/shop-data.js js/product-data.js js/product-data-midmonth.js js/product-data-monthend.js index.html shop-dashboard.html shop-creator-dashboard.html data/shop/audit-products.json data/shop/monthly-stats.json'
